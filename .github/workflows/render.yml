name: Render Video

on:
  workflow_dispatch:
  push:
    paths:
      - 'public/video.json'
      - 'src/**'
      - 'scripts/**'

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install VieNeu
        run: |
          git clone --depth 1 https://github.com/pnnbao97/VieNeu-TTS.git /tmp/VieNeu-TTS
          pip install -e /tmp/VieNeu-TTS
          pip install numpy soundfile onnxruntime
      - name: Build voice master timeline
        run: python scripts/prepare_voice.py
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npx remotion browser ensure
      - run: npm run render
      - uses: actions/upload-artifact@v4
        with:
          name: video-output
          path: out/video.mp4
